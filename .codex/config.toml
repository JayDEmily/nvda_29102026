approval_policy = "on-request"
sandbox_mode = "read-only"
allow_login_shell = false

[agents]
enabled = true
max_concurrent_threads_per_session = 2

[agents.project_manager]
description = "Schedules already-admitted semantic units after Gate 1A; never invents semantic meaning."
config_file = "agents/project-manager.toml"

[agents.integration_auditor]
description = "Source-first read-only auditor for Gate 1A semantic-index bootstrap and integration coverage."
config_file = "agents/integration-auditor.toml"

[agents.semantic_worker]
description = "Read-only source-first worker for one admitted Raw Signal semantic proposition or inseparable family."
config_file = "agents/semantic-worker.toml"

[agents.semantic_reviewer]
description = "Fresh read-only independent reviewer for semantic legitimacy and falsification."
config_file = "agents/semantic-reviewer.toml"

[agents.normative_writer]
description = "Writes one already-accepted normative obligation after its write capability is gate-locally admitted."
config_file = "agents/normative-writer.toml"

[agents.test_author]
description = "Authors adversarial tests from already-accepted normative authority; never invents requirements."
config_file = "agents/test-author.toml"

[agents.implementation_worker]
description = "Implements one already-accepted and proved obligation; never weakens tests."
config_file = "agents/implementation-worker.toml"
