version = 1
revision = 5
requires-python = "==3.13.5"
resolution-markers = [
    "sys_platform == 'linux'",
]
supported-markers = [
    "sys_platform == 'linux'",
]
required-markers = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
]

[[package]]
name = "iniconfig"
version = "2.3.1"
source = { registry = "vendor/wheels" }
wheels = [
    { path = "iniconfig-2.3.1-py3-none-any.whl" },
]

[[package]]
name = "librt"
version = "0.16.0"
source = { registry = "vendor/wheels" }
wheels = [
    { path = "librt-0.16.0-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" },
]

[[package]]
name = "mypy"
version = "1.20.1"
source = { registry = "vendor/wheels" }
dependencies = [
    { name = "librt", marker = "platform_python_implementation != 'PyPy'" },
    { name = "mypy-extensions" },
    { name = "pathspec" },
    { name = "typing-extensions" },
]
wheels = [
    { path = "mypy-1.20.1-cp313-cp313-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl" },
]

[[package]]
