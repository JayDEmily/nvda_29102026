version = "1.1.0"
source = { registry = "vendor/wheels" }
wheels = [
    { path = "mypy_extensions-1.1.0-py3-none-any.whl" },
]

[[package]]
name = "nvda-architecture-kernel"
version = "1.0.0"
source = { editable = "." }
dependencies = [
    { name = "pyyaml" },
]

[package.optional-dependencies]
dev = [
    { name = "mypy" },
    { name = "psycopg" },
    { name = "pytest" },
    { name = "ruff" },
]
postgres = [
    { name = "psycopg", extra = ["binary"] },
]

[package.metadata]
requires-dist = [
    { name = "mypy", marker = "extra == 'dev'", specifier = "==1.20.1" },
    { name = "psycopg", marker = "extra == 'dev'", specifier = "==3.3.4" },
    { name = "psycopg", extras = ["binary"], marker = "extra == 'postgres'", specifier = "==3.3.4" },
    { name = "pytest", marker = "extra == 'dev'", specifier = "==9.0.3" },
    { name = "pyyaml", specifier = "==6.0.3" },
    { name = "ruff", marker = "extra == 'dev'", specifier = "==0.15.11" },
]
provides-extras = ["postgres", "dev"]

