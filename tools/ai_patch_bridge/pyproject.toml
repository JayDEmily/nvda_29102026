[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "nvda-ai-patch-bridge"
version = "0.1.0"
description = "Local AI_PATCH_V1 GitHub inbox watcher and Codex CLI bridge"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = []
[project.optional-dependencies]
dev = []

[project.scripts]
ai-patch-bridge = "ai_patch_bridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_patch_bridge"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/ai_patch_bridge",
  "/scripts",
  "/tests",
  "/docs",
  "/examples",
  "/AGENTS.md",
  "/Makefile",
  "/README.md",
  "/pyproject.toml",
]
