schema_version: "1.0"
terms:
  - canonical_id: architecture.runtime_module
    label: runtime module
    status: active
    definition: An executable semantic owner of one coherent domain decision, transformation, policy or lifecycle.
    aliases: [semantic ownership module]
  - canonical_id: architecture.protocol
    label: protocol
    status: active
    definition: A governed information shape and its identity, versioning, validation, compatibility and carriage rules.
    aliases: [information carrier]
  - canonical_id: architecture.governance_plane
    label: governance plane
    status: active
    definition: A continuous repository constraint or evaluation mechanism that is not a runtime business service.
    aliases: []
  - canonical_id: architecture.application_shell
    label: application shell
    status: active
    definition: The startup, composition, adapter translation and top-level lifecycle boundary.
    aliases: [composition root]
  - canonical_id: architecture.technical_kernel
    label: technical kernel
    status: active
    definition: A domain-neutral shared mechanism that does not own its consumers' semantic meaning.
    aliases: [shared mechanism]
  - canonical_id: architecture.surface
    label: architecture surface
    status: active
    definition: An end-to-end responsibility or assurance view that may cross several architectural objects.
    aliases: []
  - canonical_id: architecture.public_seam
    label: public seam
    status: active
    definition: The sole registry-declared import target through which another owner may consume an active owner.
    aliases: [public API]
  - canonical_id: proof.tier
    label: proof tier
    status: active
    definition: The blocking or non-blocking proof class assigned independently of lifecycle.
    aliases: []
