modifier_policies:
  - policy_id: negative_gamma_stress
    owner_stage: posture
    admitted_surfaces:
      - max_risk_per_trade
      - hedge_required
    effects:
      - coefficient_id: max_risk_per_trade
        transform_family: clamp
        effective_value: 0.25
        rationale: Clamp risk budget under stress instead of widening discretion.
      - coefficient_id: hedge_required
        transform_family: suppression_veto
        effective_value: true
        rationale: Require the hedge overlay under stress.
