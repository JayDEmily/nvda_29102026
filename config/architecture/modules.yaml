      - Canonical D001-D209 Derived Signal occurrences with exact lineage, typed result shape and absence semantics.
    permitted_dependencies:
      - M00
    package: nvda_desk.derived_signal_calculation_truth
    public_seam: nvda_desk.derived_signal_calculation_truth.api
    exclusions:
      - provider ingestion or Raw Signal truth ownership
      - direct read/write access to M00-owned PostgreSQL relations
      - provider-specific extraction fallback inside M01
      - order/account mutation, provider/network effects or other external actions
      - downstream authority to act on calculated values
      - predictive-quality, profitability, SLA, RTO or RPO claims
      - final distribution name/version authority
