    side_effects:
      - Owner-authorised durable persistence of Derived Signal occurrences and lineage through the M01 persistence boundary only; calculated action-like values remain facts and cause no external effect.
    component_forms:
      - contract
      - schema
      - service
      - repository
      - adapter
      - configuration
    state_writer_boundary: M01-owned calculation service/repository boundary to a calculation-owner PostgreSQL schema/write role separate from M00; no M01 database-role privilege over M00-owned relations.
    state_reader_boundaries:
      - M01 typed calculation/read public seam for materialise, occurrence lookup, bounded history and exact lineage/version retrieval; downstream readers receive no M01 write authority.
      - M00 public seam typed raw-value/history projection is the sole raw-state ingress to M01.
    persistence_mechanisms:
      - PostgreSQL under a calculation-owner schema and write role separate from M00; a shared PostgreSQL deployment is permitted but direct M00-table privilege is prohibited.
    prohibited_state_writers:
      - M00
      - A00
      - downstream readers
      - PostgreSQL/SQL schema/driver/adapter as semantic owners
      - provider/network adapters
    replay_obligations:
      - Deterministic retries are idempotent for identical logical identity/inputs/versions/time; material input or version changes create append-only successor occurrences and historical Derived Signal truth is not overwritten.
