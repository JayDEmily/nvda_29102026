    description: Bounded Derived Signal Calculation Truth semantic owner with an admitted foundation implementation shell; it remains non-composable and inactive pending later governed implementation/proof.
    semantic_responsibility: Deterministically calculate and durably preserve canonical D001-D209 Derived Signal occurrences from lawfully projected M00 Raw Signal facts, compatible predecessor Derived Signal facts and exact immutable calculation/configuration/context versions, with complete lineage.
