schema_version: playbook_registry.v1
registry_id: example_playbook_registry
registry_metadata:
  authority: playbook_library
playbooks:
  gap_up_follow_through:
    setup_family: gap_up
    setup_variant_ids:
      - gap_up.baseline
      - gap_up.risk_defined
    eligibility_constraints:
      - constraint_id: permission_allow_or_derisk
        constraint_type: permission_state
        allowed_values:
          - allow
          - derisk
    selection_metadata:
      setup_family: gap_up
      play_selection: permission_gated
  breakdown_reversal:
    setup_family: breakdown
    setup_variant_ids:
      - breakdown.baseline
    eligibility_constraints: []
    selection_metadata:
      setup_family: breakdown
      play_selection: permission_gated
