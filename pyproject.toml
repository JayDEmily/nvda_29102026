[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "nvda10"
version = "0.1.0"
description = "NVDA10 execution repo"
requires-python = "==3.13.5"
license = "LicenseRef-Proprietary"
dependencies = [
  "asyncpg==0.31.0",
  "fastapi==0.135.1",
  "ibapi==9.81.1.post1",
  "orjson==3.11.7",
  "polars==1.39.3",
  "psycopg[binary]==3.3.3",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.48",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "black==26.3.1",
  "ruff==0.15.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nvda_desk", "scripts"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/nvda_desk",
  "/scripts",
  "/tests",
  "/pyproject.toml",
]

[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
  \.venv
  | \.pytest_cache
  | tmp
  | var
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "scripts", "tests"]
extend-exclude = [
  ".venv",
  ".pytest_cache",
  "tmp",
  "var",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = [
  "vocabulary_governance: deterministic vocabulary governance and synonym-escalation gate",
]
