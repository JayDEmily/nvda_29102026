name: architecture-kernel

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Proof-admission history validates every retained Git generation.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --locked --extra dev
      # PROPOSED policy only: 51 Ruff findings are anchored to immutable proof
      # generations, and any new finding or altered source is rejected.
      # NOT authorised to replace main CI without independent review.
      - name: PROPOSAL ONLY - exact SHA-bound historical Ruff gate
        run: uv run python tools/proposed_admitted_ruff_baseline.py
      - run: uv run python tools/run_promotion_gate.py --set architecture_kernel
      - run: git diff --check
