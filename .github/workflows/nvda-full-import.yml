name: NVDA historical reference transfer probe
on:
  push:
    branches: [nvda-migration-staging-20261029]
    paths: [.github/workflows/nvda-full-import.yml]
permissions:
  contents: write
jobs:
  historical-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild archive and attempt preserved commit and blob refs
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/nvda-full.bundle"
          repo="$RUNNER_TEMP/nvda-union.git"
          count=0
          for part in nvda-transfer/chunks/part-[0-9][0-9][0-9][0-9].b64; do
            base64 --decode "$part" >> "$tmp"
            count=$((count+1))
          done
          test "$count" -eq 157
          test "$(stat -c %s "$tmp")" -eq 82303405
          printf '501be44c7422d7b99359d36ea0a44754698c1b0a667a093c737dd231e559e875  %s\n' "$tmp" | sha256sum -c -
          git init --bare -q "$repo"
          git -C "$repo" fetch -q --no-tags "$tmp" '+refs/*:refs/*'
          git -C "$repo" fsck --full --no-reflogs
          test "$(git -C "$repo" for-each-ref --format='%(refname)' | wc -l | tr -d ' ')" -eq 230
          test "$(git -C "$repo" rev-parse refs/preservation/akr_sep11/heads/work/akr-7.6-final-reconciliation)" = '17263909abae9ca8cabb2440db282d12ff492ad6'
          remote="https://x-access-token:${GIT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          set +e
          git -C "$repo" push "$remote" 'refs/preservation/akr_sep11/heads/work/akr-7.6-final-reconciliation:refs/heads/nvda-preserved-akr7-probe'
          commit_rc=$?
          git -C "$repo" push "$remote" 'refs/preservation/g5oct19/source-unreachable/blob-22c12ffae969a1fe9d5221c0ea7dd566b4f9a331:refs/tags/nvda-preserved-blob-probe'
          blob_rc=$?
          set -e
          echo "RESULT commit_rc=$commit_rc blob_rc=$blob_rc; main branch unchanged"
