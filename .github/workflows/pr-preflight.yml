name: PR Preflight

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-preflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Makefile preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Show toolchain
        run: |
          set -euo pipefail
          python --version
          uv --version
          git --version

      - name: Install locked repository environment
        run: make install

      - name: Compile source and tests
        run: make compile

      - name: Verify non-editable installed package
        run: make installed-package-smoke

      - name: Run non-executing PR controls
        run: make pr-preflight

      - name: Run authoritative aggregate promotion gate
        run: make promotion-gate
